<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <style>
        /* --- Оригинальный CSS Mortis.com --- */
        BODY {
            font-family: Arial;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        H1 {
            padding-left: 20px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        DIV {
            padding: 2px;
        }

        #main {
            position: relative;
            top: 200px;
            width: 400px;
            padding: 10px;
            text-align: left;
        }

        #login {
            color: #000;
            padding: 40px;
            background-color: #fff;
            border-radius: 25px;
            background: linear-gradient(to bottom, #d4d4d4, #fff);
            position: relative;
            overflow: hidden; /* Чтобы оверлей не вылезал за скругления */
        }

        input[type=text], input[type=password] {
            width: 100%;
            font-family: Arial;
            font-size: 14px;
            color: #fff;
            padding: 4px;
            margin-bottom: 4px;
            background-color: #333;
            border: 1px solid #1a1a1a;
            box-sizing: border-box;
        }

        input[type=submit] {
            font-family: Arial;
            font-size: 16px;
            font-weight: bold;
            color: #999;
            width: 90px;
            padding: 5px;
            border: #000 solid 1px;
            border-radius: 8px;
            background: linear-gradient(to bottom, #666, #000);
            cursor: pointer;
            margin-top: 10px;
        }

        input[type=submit]:hover {
            color: #fff;
        }

        /* --- Стили пасхалки --- */
        #easter-egg-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            border-radius: 25px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        #easter-egg-overlay img {
            max-width: 85%;
            max-height: 75%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="main">
        <h1>Login</h1>
        <div id="login">
            
            <form id="mortis-form" method="post" action="/">
                <div>Username</div>
                <div><input type="text" name="login_usr" id="usr" autocomplete="off"></div>
                <div>Password</div>
                <div><input type="password" name="login_pwd" id="pwd"></div>
                <div><input type="submit" name="login_btn" value="Login"></div>
            </form>

            <!-- Оверлей с твоей гифкой -->
            <div id="easter-egg-overlay">
                <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExaW8wd2ZxZG0ybWRjcXBvaXR3eXM2ZWN0NTR5aTNxaTd6NXdzbmZpYSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/3oriO0OEd9QIDdllqo/giphy.gif" alt="Cat GIF">
                <div style="margin-top: 12px; color: #000; font-weight: bold; font-size: 14px;">Meow! 🐾</div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('mortis-form');
            const overlay = document.getElementById('easter-egg-overlay');
            const userInput = document.getElementById('usr');
            const passInput = document.getElementById('pwd');

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                const username = userInput.value.trim().toLowerCase();
                const password = passInput.value.trim().toLowerCase();

                // Проверка на логин: cat и пароль: cat
                if (username === 'cat' && password === 'cat') {
                    overlay.style.display = 'flex';
                    
                    // Показываем гифку 4 секунды, затем возвращаем форму обратно
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        form.reset();
                    }, 4000);
                } else {
                    alert('Login failed');
                    form.reset();
                }
            });
        });
    </script>

</body>
</html>
