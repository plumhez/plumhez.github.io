<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Тест Firebase</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <h1>Тест Firebase</h1>
    <div id="status">Проверка...</div>
    <div id="result"></div>

    <script>
        console.log('🚀 Тест Firebase запущен');

        // ТВОЯ КОНФИГУРАЦИЯ
        const firebaseConfig = {
            apiKey: "AIzaSyDLbYzjQBqtjRAlR6-CZj2TZXJgb2Esz4M",
            authDomain: "plumhez.firebaseapp.com",
            databaseURL: "https://plumhez-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "plumhez",
            storageBucket: "plumhez.firebasestorage.app",
            messagingSenderId: "454691669371",
            appId: "1:454691669371:web:739560d5c759182785e9de",
            measurementId: "G-QH35KQ4ZLD"
        };

        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');

        try {
            statusDiv.textContent = '🔄 Инициализация Firebase...';
            console.log('1️⃣ Инициализация Firebase');

            firebase.initializeApp(firebaseConfig);
            const database = firebase.database();

            statusDiv.textContent = '✅ Firebase инициализирована!';

            // Проверка соединения
            const connectedRef = firebase.database().ref('.info/connected');
            connectedRef.on('value', function(snap) {
                if (snap.val() === true) {
                    statusDiv.textContent = '✅ СОЕДИНЕНИЕ УСТАНОВЛЕНО!';
                    statusDiv.style.color = 'green';
                    resultDiv.innerHTML = '✅ Firebase работает! 🎉';

                    // Пишем тестовые данные
                    firebase.database().ref('test').set({
                        message: 'Тест работает!',
                        time: Date.now()
                    }).then(() => {
                        resultDiv.innerHTML += '<br>✅ Тестовая запись создана!';
                    }).catch((err) => {
                        resultDiv.innerHTML += '<br>❌ Ошибка записи: ' + err.message;
                    });

                } else {
                    statusDiv.textContent = '⏳ Ожидание соединения...';
                    statusDiv.style.color = 'orange';
                }
            });

        } catch (e) {
            statusDiv.textContent = '❌ ОШИБКА: ' + e.message;
            statusDiv.style.color = 'red';
            console.error('❌ Ошибка:', e);
        }

        console.log('📋 Проверь консоль для деталей');
    </script>
</body>
</html>
