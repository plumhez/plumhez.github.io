<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <style>
        BODY {
            font-family: Arial;
            background-color: #000;
            color: #fff;
        }

        H1 {
            padding-left: 20px;
        }

        DIV {
            padding: 2px;
        }

        #main {
            position: relative;
            top: 200px;
            margin: auto;
            width: 400px;
            padding: 10px;
        }

        #login {
            color: #000;
            padding: 40px;
            background-color: #fff;
            border-radius: 25px;
            background: linear-gradient(to bottom, #d4d4d4, #fff);
        }

        .error {
            color: #800000;
            font-weight: bold;
            padding-bottom: 10px;
        }

        input[type=text], input[type=password] {
            width: 100%;
            font-family: Arial;
            font-size: 14px;
            color: #fff;
            padding: 2px;
            margin-bottom: 2px;
            background-color: #333;
            border: 1px solid #1a1a1a;
            box-sizing: border-box;
        }

        input[type=submit] {
            font-family: Arial;
            font-size: 16px;
            font-weight: bold;
            color: #999;
            width: 90px;
            padding: 5px;
            border: #000 solid 1px;
            border-radius: 8px;
            background: linear-gradient(to bottom, #666, #000);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="main">
        <h1>Login</h1>
        <div id="login">
            <form method="post" action="/" onsubmit="event.preventDefault();">
                <div>Username</div>
                <div><input type="text" name="login_usr" autocomplete="off"></div>
                <div>Password</div>
                <div><input type="password" name="login_pwd"></div>
                <div><input type="submit" name="login_btn" value="Login"></div>
            </form>
        </div>
    </div>

</body>
</html>
