<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORTIS // BINARY PROCESSOR</title>
    <!-- Пиксельный VHS шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mortis-card">
    <div class="title">BINARY PROCESSOR</div>

    <div class="field">
        <label>SELECT IMAGE</label>
        <div class="file-input-wrapper">
            <span id="fileName">CHOOSE FILE...</span>
            <input type="file" id="imageLoader" accept="image/*">
        </div>
    </div>

    <div class="field range-wrapper">
        <label>THRESHOLD: <span id="thresholdVal">128</span></label>
        <input type="range" id="threshold" min="0" max="255" value="128">
    </div>

    <button id="downloadBtn" class="mortis-btn" style="display: none;">DOWNLOAD IMAGE</button>

    <canvas id="imageCanvas"></canvas>
</div>

<script>
    const imageLoader = document.getElementById('imageLoader');
    const fileNameSpan = document.getElementById('fileName');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const thresholdSlider = document.getElementById('threshold');
    const thresholdVal = document.getElementById('thresholdVal');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentImg = null;

    imageLoader.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileNameSpan.textContent = file.name;

        const reader = new FileReader();
        reader.onload = (event) => {
            currentImg = new Image();
            currentImg.onload = () => {
                canvas.width = currentImg.width;
                canvas.height = currentImg.height;
                processImage();
                downloadBtn.style.display = 'block';
            };
            currentImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    thresholdSlider.addEventListener('input', () => {
        thresholdVal.textContent = thresholdSlider.value;
        processImage();
    });

    function processImage() {
        if (!currentImg) return;

        const threshold = parseInt(thresholdSlider.value);
        ctx.drawImage(currentImg, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            const avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            const binary = avg >= threshold ? 255 : 0;

            data[i] = binary;
            data[i + 1] = binary;
            data[i + 2] = binary;
        }

        ctx.putImageData(imgData, 0, 0);
    }

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'binary_mortis.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
