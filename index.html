<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пупс чат</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body.menu-open .glass-card {
            filter: blur(8px);
            pointer-events: none;
            transition: filter 0.4s ease;
        }

        body.menu-open::after {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9;
        }

        .glass-card {
            max-width: 600px;
            width: 100%;
            background: #141414;
            border-radius: 32px;
            padding: 52px 40px 44px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: filter 0.4s ease;
        }

        .sticker-baby {
            font-size: 80px;
            display: block;
            margin: 0 auto 12px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 60%, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #888;
            margin: 4px 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .user-badge span {
            color: #ccc;
        }

        .sub-tg {
            font-size: 0.8rem;
            color: #555;
            background: rgba(255, 255, 255, 0.03);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 28px;
        }
        .sub-tg a {
            color: #666;
            text-decoration: none;
            font-weight: 600;
        }
        .sub-tg a:hover {
            color: #aaa;
        }

        .btn-chats {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 48px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
            width: 100%;
            max-width: 280px;
        }
        .btn-chats:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            max-width: 88vw;
            height: 100vh;
            background: #111;
            backdrop-filter: blur(24px);
            padding: 32px 24px 40px;
            z-index: 99;
            transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            overflow-y: auto;
        }
        .side-menu.open {
            right: 0;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .menu-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
        }
        .menu-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #555;
            transition: all 0.2s;
        }
        .menu-close:hover {
            color: #aaa;
            transform: rotate(90deg);
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .chat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s;
        }
        .chat-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }
        .chat-item .emoji-badge {
            font-size: 1.6rem;
            min-width: 36px;
        }
        .chat-item .chat-name {
            flex: 1;
            color: #e0e0e0;
        }
        .chat-item .chat-badge {
            background: rgba(255, 255, 255, 0.06);
            color: #666;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 14px;
            border-radius: 30px;
        }
        .chat-item.locked .chat-badge {
            color: #884;
            background: rgba(200, 80, 80, 0.1);
        }
        .chat-item.unlocked .chat-badge {
            color: #484;
            background: rgba(80, 200, 80, 0.08);
        }

        .menu-footer {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.75rem;
            color: #444;
            text-align: center;
        }
        .menu-footer a {
            color: #555;
            text-decoration: none;
            font-weight: 600;
        }

        .chat-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0f0f0f;
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
        }
        .chat-window.open {
            transform: translateX(0);
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            background: #141414;
            flex-shrink: 0;
            min-height: 68px;
        }
        .chat-header .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
        }
        .chat-header .chat-title span {
            font-size: 1.6rem;
        }

        .chat-header .chat-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-chats-mini {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #aaa;
            cursor: pointer;
            transition: all 0.25s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .btn-chats-mini:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .chat-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #555;
            transition: all 0.2s;
            padding: 0 4px;
        }
        .chat-close:hover {
            color: #aaa;
            transform: rotate(90deg);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chat-message {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .chat-message.own {
            align-self: flex-end;
            background: rgba(255, 255, 255, 0.08);
            color: #f0f0f0;
            border-bottom-right-radius: 4px;
        }
        .chat-message.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.04);
            color: #ccc;
            border-bottom-left-radius: 4px;
        }
        .chat-message .msg-user {
            font-size: 0.7rem;
            font-weight: 600;
            color: #888;
            margin-bottom: 2px;
        }
        .chat-message .msg-text {
            font-size: 0.95rem;
        }
        .chat-message .msg-time {
            font-size: 0.6rem;
            color: #555;
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-area {
            display: flex;
            gap: 12px;
            padding: 16px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            background: #141414;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input-area input::placeholder {
            color: #444;
        }
        .chat-input-area input:focus {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .chat-input-area button {
            padding: 12px 28px;
            border-radius: 16px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .chat-input-area button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .chat-messages .empty-chat {
            color: #444;
            text-align: center;
            font-size: 0.9rem;
            margin-top: 40px;
        }

        .password-modal,
        .nickname-modal {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .password-modal.active,
        .nickname-modal.active {
            opacity: 1;
            pointer-events: all;
        }
        .password-modal-content,
        .nickname-modal-content {
            background: #161616;
            padding: 40px 36px;
            border-radius: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .password-modal.active .password-modal-content,
        .nickname-modal.active .nickname-modal-content {
            transform: scale(1) translateY(0);
        }
        .password-modal-content h3,
        .nickname-modal-content h3 {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 2px;
        }
        .password-modal-content .chat-name-display {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
            display: block;
        }
        .password-modal-content input,
        .nickname-modal-content input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            outline: none;
            margin-bottom: 10px;
        }
        .password-modal-content input::placeholder,
        .nickname-modal-content input::placeholder {
            color: #444;
        }
        .password-modal-content input:focus,
        .nickname-modal-content input:focus {
            border-color: rgba(255, 255, 255, 0.2);
        }
        .password-modal-content .error-msg {
            color: #c55;
            font-size: 0.8rem;
            min-height: 22px;
            margin-bottom: 8px;
        }
        .password-modal-content .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .password-modal-content .modal-buttons button,
        .nickname-modal-content .btn-set-nick {
            padding: 12px 28px;
            border-radius: 16px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .password-modal-content .btn-confirm {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            flex: 1;
        }
        .password-modal-content .btn-confirm:hover {
            background: rgba(255, 255, 255, 0.16);
        }
        .password-modal-content .btn-cancel {
            background: rgba(255, 255, 255, 0.04);
            color: #666;
            flex: 0.5;
        }
        .password-modal-content .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .nickname-modal-content .btn-set-nick {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .nickname-modal-content .btn-set-nick:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .nickname-modal-content .sub-hint {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .nickname-modal-content .sub-hint small {
            color: #444;
            display: block;
            margin-top: 4px;
            font-size: 0.75rem;
        }
        .nickname-modal-content .sticker-baby-big {
            font-size: 64px;
            display: block;
            margin-bottom: 4px;
        }
        .password-modal-content .sticker-lock {
            font-size: 48px;
            display: block;
            margin-bottom: 4px;
        }

        @media (max-width: 500px) {
            .glass-card {
                padding: 36px 20px 32px;
            }
            h1 {
                font-size: 2.2rem;
            }
            .btn-chats {
                padding: 14px 24px;
                font-size: 1rem;
                max-width: 100%;
            }
            .side-menu {
                width: 100%;
                max-width: 100vw;
                right: -110%;
            }
            .side-menu.open {
                right: 0;
            }
            .sticker-baby {
                font-size: 60px;
            }
            .chat-messages {
                padding: 14px 16px;
            }
            .chat-input-area {
                padding: 12px 16px;
                flex-wrap: wrap;
            }
            .chat-input-area button {
                width: 100%;
            }
            .chat-header .chat-title {
                font-size: 1rem;
            }
            .btn-chats-mini {
                font-size: 0.75rem;
                padding: 6px 14px;
            }
            .chat-close {
                font-size: 1.4rem;
            }
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="glass-card" id="mainCard">
        <span class="sticker-baby">👶</span>
        <h1>Пупс чат</h1>
        <div class="user-badge">👤 <span id="nicknameDisplay">Гость</span></div>
        <div class="sub-tg">📌 тг <a href="https://t.me/rcvpg" target="_blank">@rcvpg</a> — пароли для пупсов</div>
        <button class="btn-chats" id="openMenuBtn">💬 Чаты</button>
    </div>

    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <h2>💬 Чаты</h2>
            <button class="menu-close" id="closeMenuBtn">✕</button>
        </div>
        <div class="chat-list" id="chatList"></div>
        <div class="menu-footer">🔐 пароли — <a href="https://t.me/rcvpg" target="_blank">@rcvpg</a></div>
    </div>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <div class="chat-title">
                <span id="chatWindowEmoji">🌐</span>
                <span id="chatWindowTitle">Общий</span>
            </div>
            <div class="chat-actions">
                <button class="btn-chats-mini" id="openMenuFromChatBtn">📋 Чаты</button>
                <button class="chat-close" id="chatCloseBtn">✕</button>
            </div>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="empty-chat">💬 Сообщений пока нет</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Напишите сообщение..." maxlength="500" />
            <button id="chatSendBtn">➤ Отправить</button>
        </div>
    </div>

    <div class="password-modal" id="passwordModal">
        <div class="password-modal-content">
            <span class="sticker-lock">🔐</span>
            <h3>Введите пароль</h3>
            <span class="chat-name-display" id="passwordChatName">Общий #2</span>
            <input type="password" id="passwordInput" placeholder="Пароль от чата" />
            <div class="error-msg" id="passwordError"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="passwordCancel">Отмена</button>
                <button class="btn-confirm" id="passwordConfirm">Войти</button>
            </div>
        </div>
    </div>

    <div class="nickname-modal" id="nicknameModal">
        <div class="nickname-modal-content">
            <span class="sticker-baby-big">👶</span>
            <h3>Привет, пупс!</h3>
            <div class="sub-hint">Введите ваш псевдоним <small>он сохранится навсегда</small></div>
            <input type="text" id="nicknameInput" placeholder="Ваш псевдоним" maxlength="30" />
            <button class="btn-set-nick" id="setNickBtn">Сохранить</button>
        </div>
    </div>

    <script>
        // ============ FIREBASE ============
        const firebaseConfig = {
            apiKey: "AIzaSyDLbYzjQBqtjRAlR6-CZj2TZXJgb2Esz4M",
            authDomain: "plumhez.firebaseapp.com",
            databaseURL: "https://plumhez-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "plumhez",
            storageBucket: "plumhez.firebasestorage.app",
            messagingSenderId: "454691669371",
            appId: "1:454691669371:web:739560d5c759182785e9de",
            measurementId: "G-QH35KQ4ZLD"
        };

        let database = null;
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            console.log('✅ Firebase подключена');
        } catch (e) {
            console.error('❌ Ошибка Firebase:', e);
        }

        // ============ ДАННЫЕ ============
        const CHATS = [
            { id: 'general', name: 'Общий', emoji: '🌐', badge: 'все', password: null },
            { id: 'general2', name: 'Общий #2', emoji: '🔹', badge: '🔒', password: 'pupsland.on.top' },
            { id: 'general3', name: 'Общий #3', emoji: '🔸', badge: '🔒', password: 'spworld.soset' },
            { id: 'general4', name: 'Общий #4', emoji: '🟣', badge: '🔒', password: 'plumhez.pidor' }
        ];

        let currentNickname = localStorage.getItem('pups_nickname') || '';
        let unlockedChats = JSON.parse(localStorage.getItem('pups_unlocked') || '[]');
        let currentChatId = null;
        let messagesListener = null;

        // ============ ЭЛЕМЕНТЫ ============
        const nicknameModal = document.getElementById('nicknameModal');
        const nicknameInput = document.getElementById('nicknameInput');
        const setNickBtn = document.getElementById('setNickBtn');
        const nicknameDisplay = document.getElementById('nicknameDisplay');

        const passwordModal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const passwordError = document.getElementById('passwordError');
        const passwordChatName = document.getElementById('passwordChatName');
        const passwordConfirm = document.getElementById('passwordConfirm');
        const passwordCancel = document.getElementById('passwordCancel');

        const chatList = document.getElementById('chatList');
        const openMenuBtn = document.getElementById('openMenuBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const sideMenu = document.getElementById('sideMenu');

        const chatWindow = document.getElementById('chatWindow');
        const chatWindowTitle = document.getElementById('chatWindowTitle');
        const chatWindowEmoji = document.getElementById('chatWindowEmoji');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const chatCloseBtn = document.getElementById('chatCloseBtn');
        const openMenuFromChatBtn = document.getElementById('openMenuFromChatBtn');

        let pendingChatId = null;

        // ============ ПСЕВДОНИМ ============
        function showNicknameModal() {
            nicknameModal.classList.add('active');
            nicknameInput.value = currentNickname || '';
            nicknameInput.focus();
        }

        function hideNicknameModal() {
            nicknameModal.classList.remove('active');
        }

        function setNickname() {
            const val = nicknameInput.value.trim();
            if (val.length < 2) {
                alert('Псевдоним должен быть хотя бы 2 символа');
                return;
            }
            currentNickname = val;
            localStorage.setItem('pups_nickname', currentNickname);
            nicknameDisplay.textContent = currentNickname;
            hideNicknameModal();
        }

        // ============ ПАРОЛИ ============
        function isChatUnlocked(chatId) {
            return unlockedChats.includes(chatId);
        }

        function unlockChat(chatId) {
            if (!unlockedChats.includes(chatId)) {
                unlockedChats.push(chatId);
                localStorage.setItem('pups_unlocked', JSON.stringify(unlockedChats));
            }
        }

        function showPasswordModal(chatId, chatName) {
            pendingChatId = chatId;
            passwordChatName.textContent = chatName;
            passwordInput.value = '';
            passwordError.textContent = '';
            passwordModal.classList.add('active');
            setTimeout(() => passwordInput.focus(), 100);
        }

        function hidePasswordModal() {
            passwordModal.classList.remove('active');
            pendingChatId = null;
        }

        function tryPassword() {
            const entered = passwordInput.value.trim();
            const chat = CHATS.find(c => c.id === pendingChatId);
            if (!chat) return;

            if (entered === chat.password) {
                unlockChat(chat.id);
                hidePasswordModal();
                renderChats();
                openChat(chat.id);
            } else {
                passwordError.textContent = '❌ Неверный пароль';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // ============ ОТРИСОВКА СПИСКА ЧАТОВ ============
        function renderChats() {
            chatList.innerHTML = '';
            CHATS.forEach(chat => {
                const unlocked = isChatUnlocked(chat.id) || !chat.password;
                const div = document.createElement('div');
                div.className = `chat-item ${unlocked ? 'unlocked' : 'locked'}`;
                div.innerHTML = `
                    <span class="emoji-badge">${chat.emoji}</span>
                    <span class="chat-name">${chat.name}</span>
                    <span class="chat-badge">${unlocked ? '✅' : '🔒'}</span>
                `;
                div.addEventListener('click', () => {
                    if (!currentNickname) {
                        alert('Сначала укажите псевдоним!');
                        showNicknameModal();
                        return;
                    }
                    openChat(chat.id);
                });
                chatList.appendChild(div);
            });
        }

        // ============ ОТКРЫТЬ ЧАТ ============
        function openChat(chatId) {
            const chat = CHATS.find(c => c.id === chatId);
            if (!chat) return;

            if (chat.password && !isChatUnlocked(chat.id)) {
                showPasswordModal(chat.id, chat.name);
                return;
            }

            currentChatId = chatId;
            chatWindowTitle.textContent = chat.name;
            chatWindowEmoji.textContent = chat.emoji;
            chatWindow.classList.add('open');
            chatInput.focus();

            chatMessages.innerHTML = '<div class="empty-chat">⏳ Загрузка сообщений...</div>';

            if (messagesListener) {
                messagesListener();
                messagesListener = null;
            }

            if (database) {
                const messagesRef = firebase.database().ref('chats/' + chatId + '/messages');
                messagesListener = messagesRef.orderByChild('timestamp').limitToLast(100).on('child_added', (snapshot) => {
                    const data = snapshot.val();
                    const emptyEl = chatMessages.querySelector('.empty-chat');
                    if (emptyEl) emptyEl.remove();
                    addMessageToChat(data.user, data.text, data.timestamp, data.user === currentNickname);
                });

                const chatRef = firebase.database().ref('chats/' + chatId);
                chatRef.once('value', (snap) => {
                    if (!snap.exists()) {
                        chatRef.set({ created: Date.now() });
                    }
                });
            } else {
                chatMessages.innerHTML = '<div class="empty-chat">❌ База данных не подключена</div>';
            }

            closeMenu();
        }

        // ============ ДОБАВИТЬ СООБЩЕНИЕ ============
        function addMessageToChat(user, text, timestamp, isOwn) {
            const div = document.createElement('div');
            div.className = `chat-message ${isOwn ? 'own' : 'other'}`;

            const time = new Date(timestamp).toLocaleTimeString('ru-RU', {
                hour: '2-digit',
                minute: '2-digit'
            });

            div.innerHTML = `
                <div class="msg-user">${user || 'Аноним'}</div>
                <div class="msg-text">${text}</div>
                <div class="msg-time">${time}</div>
            `;

            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ============ ОТПРАВИТЬ СООБЩЕНИЕ ============
        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !currentChatId || !database) return;
            if (!currentNickname) {
                alert('Сначала укажите псевдоним!');
                showNicknameModal();
                return;
            }

            const messagesRef = firebase.database().ref('chats/' + currentChatId + '/messages');
            messagesRef.push({
                user: currentNickname,
                text: text,
                timestamp: Date.now()
            });

            chatInput.value = '';
            chatInput.focus();
        }

        // ============ УПРАВЛЕНИЕ МЕНЮ ============
        function openMenu() {
            sideMenu.classList.add('open');
            document.body.classList.add('menu-open');
            renderChats();
        }

        function closeMenu() {
            sideMenu.classList.remove('open');
            document.body.classList.remove('menu-open');
        }

        function closeChat() {
            chatWindow.classList.remove('open');
            document.body.classList.remove('chat-open');
            if (messagesListener) {
                messagesListener();
                messagesListener = null;
            }
            currentChatId = null;
        }
