<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortis // Image Processor</title>
    <!-- Подключение VHS пиксельного шрифта -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Окно в стиле mortis.com */
        .mortis-card {
            background-color: #e5e5e5;
            border-radius: 12px;
            padding: 24px;
            width: 340px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.7);
        }

        /* Заголовок карточки */
        .card-title {
            color: #000000;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        /* Эффект VHS текста над полем ввода */
        .vhs-text {
            font-family: 'VT323', 'Courier New', monospace;
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background-color: #0d0d0d;
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 14px;
            display: inline-block;
            width: 100%;
            text-shadow: 
                -2px 0 2px rgba(255, 0, 80, 0.8),
                 2px 0 2px rgba(0, 220, 255, 0.8),
                 0 0 6px rgba(255, 255, 255, 0.5);
            filter: blur(0.3px);
        }

        .field {
            margin-bottom: 12px;
        }

        .field label {
            display: block;
            color: #333333;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        /* Поле выбора файла в стиле Mortis */
        .file-input-wrapper {
            position: relative;
            background-color: #3a3a3a;
            border-radius: 3px;
            padding: 8px 10px;
            cursor: pointer;
            text-align: left;
        }

        .file-input-wrapper span {
            color: #bbbbbb;
            font-size: 12px;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Ползунок порога контраста */
        .range-wrapper {
            margin-top: 10px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #333333;
        }

        /* Глянцевая кнопка Mortis */
        .mortis-btn {
            background: linear-gradient(180deg, #4c4c4c 0%, #1f1f1f 50%, #080808 100%);
            color: #ffffff;
            border: 1px solid #111111;
            border-radius: 5px;
            padding: 8px 18px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
            margin-top: 10px;
            width: 100%;
            text-shadow: 0 -1px 0 #000;
        }

        .mortis-btn:active {
            background: linear-gradient(180deg, #080808 0%, #1f1f1f 50%, #4c4c4c 100%);
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-top: 15px;
            display: block;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<div class="mortis-card">
    <div class="card-title">Image Processor</div>

    <!-- Текст с VHS эффектом -->
    <div class="vhs-text">
        SYSTEM READY // PROCESS PHOTO
    </div>

    <div class="field">
        <label>Select Photo</label>
        <div class="file-input-wrapper">
            <span id="fileName">Choose File...</span>
            <input type="file" id="imageLoader" accept="image/*">
        </div>
    </div>

    <div class="field range-wrapper">
        <label>Contrast Threshold</label>
        <input type="range" id="threshold" min="0" max="255" value="128">
    </div>

    <button id="downloadBtn" class="mortis-btn" style="display: none;">Download Binary Image</button>

    <canvas id="imageCanvas"></canvas>
</div>

<script>
    const imageLoader = document.getElementById('imageLoader');
    const fileNameSpan = document.getElementById('fileName');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const thresholdSlider = document.getElementById('threshold');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentImg = null;

    imageLoader.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileNameSpan.textContent = file.name;

        const reader = new FileReader();
        reader.onload = (event) => {
            currentImg = new Image();
            currentImg.onload = () => {
                canvas.width = currentImg.width;
                canvas.height = currentImg.height;
                processImage();
                downloadBtn.style.display = 'block';
            };
            currentImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    thresholdSlider.addEventListener('input', processImage);

    // Попиксельный перевод в 1-битный Ч/Б (без полутонов)
    function processImage() {
        if (!currentImg) return;

        const threshold = parseInt(thresholdSlider.value);
        ctx.drawImage(currentImg, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            const avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            const binary = avg >= threshold ? 255 : 0;

            data[i] = binary;
            data[i + 1] = binary;
            data[i + 2] = binary;
        }

        ctx.putImageData(imgData, 0, 0);
    }

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'binary_mortis.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
