<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PupsLand Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

html,body{

width:100%;
height:100%;

overflow:hidden;

background:#f5f5f7;

}

body{

display:flex;

justify-content:center;

align-items:center;

}

/* ===================== */

.background{

position:fixed;

inset:0;

background:

radial-gradient(circle at top,#ffffff,#f5f5f7 55%,#ececec);

animation:bg 12s ease infinite;

z-index:-1;

}

@keyframes bg{

0%{

transform:scale(1);

}

50%{

transform:scale(1.04);

}

100%{

transform:scale(1);

}

}

/* ===================== */

.login{

position:absolute;

width:100%;
height:100%;

display:flex;

align-items:center;

justify-content:center;

transition:.6s;

}

.card{

width:420px;

background:rgba(255,255,255,.82);

backdrop-filter:blur(30px);

padding:45px;

border-radius:34px;

box-shadow:

0 25px 70px rgba(0,0,0,.08);

animation:appear .8s;

}

@keyframes appear{

from{

opacity:0;

transform:

translateY(40px)

scale(.96);

}

to{

opacity:1;

transform:

translateY(0)

scale(1);

}

}

.logo{

font-size:54px;

text-align:center;

margin-bottom:18px;

}

.card h1{

text-align:center;

font-size:33px;

margin-bottom:10px;

}

.card p{

text-align:center;

color:#777;

margin-bottom:35px;

}

.card input{

width:100%;

height:58px;

border:none;

outline:none;

background:#f2f2f2;

border-radius:18px;

padding:0 18px;

font-size:16px;

transition:.3s;

margin-bottom:18px;

}

.card input:focus{

background:white;

box-shadow:

0 0 0 4px rgba(0,122,255,.15);

}

.card button{

width:100%;

height:58px;

border:none;

border-radius:18px;

background:#0071e3;

color:white;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:.25s;

}

.card button:hover{

transform:translateY(-2px);

box-shadow:

0 15px 30px rgba(0,113,227,.25);

}

/* ===================== */

.chat{

display:none;

position:fixed;

inset:0;

background:#f5f5f7;

flex-direction:column;

opacity:0;

transition:.6s;

}
  .chat.show{

display:flex;

opacity:1;

}

/* ========================= */

header{

height:78px;

background:rgba(255,255,255,.75);

backdrop-filter:blur(25px);

border-bottom:1px solid rgba(0,0,0,.06);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 30px;

}

.brand{

display:flex;

align-items:center;

gap:14px;

}

.brand .icon{

width:46px;
height:46px;

border-radius:15px;

background:linear-gradient(135deg,#ffffff,#e9e9eb);

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

box-shadow:

0 10px 25px rgba(0,0,0,.08);

}

.brand h2{

font-size:21px;

font-weight:700;

color:#1d1d1f;

}

.brand span{

font-size:13px;

color:#777;

}

.online{

font-size:14px;

color:#22c55e;

font-weight:600;

}

.messages{

flex:1;

overflow-y:auto;

padding:30px;

display:flex;

flex-direction:column;

gap:15px;

}

.message{

max-width:430px;

background:white;

padding:16px 18px;

border-radius:24px;

box-shadow:

0 8px 20px rgba(0,0,0,.05);

animation:pop .3s;

}

.self{

margin-left:auto;

background:#007aff;

color:white;

}

.author{

font-size:13px;

font-weight:700;

margin-bottom:5px;

opacity:.75;

}

.time{

font-size:11px;

margin-top:8px;

opacity:.55;

}

@keyframes pop{

from{

opacity:0;

transform:

translateY(20px)

scale(.96);

}

to{

opacity:1;

transform:

translateY(0)

scale(1);

}

}

.bottom{

height:90px;

background:white;

border-top:1px solid rgba(0,0,0,.06);

padding:18px;

display:flex;

gap:15px;

}

.bottom input{

flex:1;

border:none;

outline:none;

background:#f2f2f2;

border-radius:18px;

padding:0 18px;

font-size:16px;

}

.bottom button{

width:60px;

border:none;

border-radius:18px;

background:#007aff;

color:white;

font-size:22px;

cursor:pointer;

transition:.25s;

}

.bottom button:hover{

transform:scale(1.06);

}

::-webkit-scrollbar{

width:8px;

}

::-webkit-scrollbar-thumb{

background:#d5d5d5;

border-radius:999px;

}

@media(max-width:700px){

.card{

width:92%;

padding:30px;

}

header{

padding:0 18px;

}

.messages{

padding:18px;

}

.message{

max-width:90%;

}

}

</style>

</head>

<body>

<div class="background"></div>

<div class="login" id="login">

<div class="card">

<div class="logo">💬</div>

<h1>PupsLand</h1>

<p>Введите любой псевдоним</p>

<input id="nickname" placeholder="Например: Max">

<button id="join">

Войти

</button>

</div>

</div>

<div class="chat" id="chat">

<header>

<div class="brand">

<div class="icon">

💬

</div>

<div>

<h2>PupsLand Chat</h2>

<span>Общий чат</span>

</div>

</div>

<div class="online">

● Онлайн

</div>

</header>

<div class="messages" id="messages">
  </div>

<div class="bottom">

<input
id="message"
type="text"
placeholder="Напишите сообщение...">

<button id="send">

➜

</button>

</div>

</div>

<script>

const login=document.getElementById("login");

const chat=document.getElementById("chat");

const join=document.getElementById("join");

const nickname=document.getElementById("nickname");

const messages=document.getElementById("messages");

const message=document.getElementById("message");

const send=document.getElementById("send");

let user=localStorage.getItem("nickname");

function time(){

const d=new Date();

return d.getHours().toString().padStart(2,"0")

+":"

+d.getMinutes().toString().padStart(2,"0");

}

function add(author,text,self=false){

const div=document.createElement("div");

div.className=self?"message self":"message";

div.innerHTML=`

<div class="author">${author}</div>

<div>${text}</div>

<div class="time">${time()}</div>

`;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

}

function openChat(){

login.style.opacity="0";

login.style.transform="scale(.95)";

setTimeout(()=>{

login.style.display="none";

chat.style.display="flex";

requestAnimationFrame(()=>{

chat.classList.add("show");

});

},500);

}

if(user){

nickname.value=user;

openChat();

add(

"PupsLand",

"Добро пожаловать обратно 👋"

);

}

join.onclick=()=>{

const nick=nickname.value.trim();

if(nick.length<2){

nickname.focus();

return;

}

localStorage.setItem("nickname",nick);

user=nick;

openChat();

add(

"PupsLand",

"Добро пожаловать в общий чат!"

);

};
  send.onclick=sendMessage;

message.addEventListener("keydown",e=>{

if(e.key==="Enter"){

sendMessage();

}

});

function sendMessage(){

const text=message.value.trim();

if(text==="") return;

add(user,text,true);

message.value="";

message.focus();

/* Пока локальный чат.
Позже сюда подключим сервер */

}

setTimeout(()=>{

if(chat.classList.contains("show")){

add(

"Система",

"👋 Добро пожаловать в PupsLand Chat"

);

}

},1200);

setTimeout(()=>{

if(chat.classList.contains("show")){

add(

"Система",

"Пока это локальная версия. Скоро подключим общий чат."

);

}

},2200);

</script>

</body>
</html>
