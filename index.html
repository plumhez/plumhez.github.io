<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORTIS // BINARY PROCESSOR</title>
    <!-- Пиксельный VHS шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            /* Применяем VHS-шрифт ко ВСЕМУ сайту */
            font-family: 'VT323', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }

        /* Тёмная панель mortis.com */
        .mortis-card {
            background-color: #0d0d0d;
            border: 1px solid #222222;
            border-radius: 8px;
            padding: 28px;
            width: 380px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
        }

        /* Общие правила для текста с эффектом VHS/CRT */
        .vhs-glow, .title, label, .file-input-wrapper span, .mortis-btn {
            font-family: 'VT323', 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            /* Хроматический RGB-сдвиг */
            text-shadow: 
                -1.5px 0 2px rgba(255, 0, 80, 0.8),
                 1.5px 0 2px rgba(0, 220, 255, 0.8),
                 0 0 5px rgba(255, 255, 255, 0.4);
            filter: blur(0.2px);
        }

        .title {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 20px;
            border-bottom: 1px dashed #333333;
            padding-bottom: 8px;
            text-align: center;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            color: #aaaaaa;
            font-size: 16px;
            margin-bottom: 6px;
        }

        /* Кастомное поле выбора файла */
        .file-input-wrapper {
            position: relative;
            background-color: #141414;
            border: 1px solid #333333;
            border-radius: 4px;
            padding: 10px 12px;
            cursor: pointer;
            text-align: center;
            transition: border-color 0.2s;
        }

        .file-input-wrapper:hover {
            border-color: #666666;
        }

        .file-input-wrapper span {
            color: #dddddd;
            font-size: 18px;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .range-wrapper {
            margin-top: 14px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #555555;
            background: #222;
            cursor: pointer;
        }

        /* VHS Кнопка */
        .mortis-btn {
            background: #141414;
            color: #ffffff;
            border: 1px solid #444444;
            border-radius: 4px;
            padding: 10px 18px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            transition: all 0.2s ease;
        }

        .mortis-btn:hover {
            background: #222222;
            border-color: #888888;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .mortis-btn:active {
            background: #000000;
        }

        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-top: 18px;
            display: block;
            border: 1px solid #222222;
            background-color: #000000;
        }
    </style>
</head>
<body>

<div class="mortis-card">
    <div class="title">BINARY PROCESSOR</div>

    <div class="field">
        <label>SELECT IMAGE</label>
        <div class="file-input-wrapper">
            <span id="fileName">CHOOSE FILE...</span>
            <input type="file" id="imageLoader" accept="image/*">
        </div>
    </div>

    <div class="field range-wrapper">
        <label>THRESHOLD: <span id="thresholdVal">128</span></label>
        <input type="range" id="threshold" min="0" max="255" value="128">
    </div>

    <button id="downloadBtn" class="mortis-btn" style="display: none;">DOWNLOAD IMAGE</button>

    <canvas id="imageCanvas"></canvas>
</div>

<script>
    const imageLoader = document.getElementById('imageLoader');
    const fileNameSpan = document.getElementById('fileName');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const thresholdSlider = document.getElementById('threshold');
    const thresholdVal = document.getElementById('thresholdVal');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentImg = null;

    imageLoader.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileNameSpan.textContent = file.name;

        const reader = new FileReader();
        reader.onload = (event) => {
            currentImg = new Image();
            currentImg.onload = () => {
                canvas.width = currentImg.width;
                canvas.height = currentImg.height;
                processImage();
                downloadBtn.style.display = 'block';
            };
            currentImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    thresholdSlider.addEventListener('input', () => {
        thresholdVal.textContent = thresholdSlider.value;
        processImage();
    });

    // 1-битная бинаризация (только чистый 0,0,0 и 255,255,255)
    function processImage() {
        if (!currentImg) return;

        const threshold = parseInt(thresholdSlider.value);
        ctx.drawImage(currentImg, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            const avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            const binary = avg >= threshold ? 255 : 0;

            data[i] = binary;
            data[i + 1] = binary;
            data[i + 2] = binary;
        }

        ctx.putImageData(imgData, 0, 0);
    }

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'binary_mortis.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
