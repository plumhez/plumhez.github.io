<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="mortis-panel">
    <h2>Image Processor</h2>
    
    <div class="form-group">
        <label for="imageLoader">Select File</label>
        <input type="file" id="imageLoader" accept="image/*">
    </div>

    <div class="form-group">
        <label for="threshold">Threshold</label>
        <input type="range" id="threshold" min="0" max="255" value="128">
    </div>

    <button id="processBtn" class="mortis-btn">Process</button>
    <button id="downloadBtn" class="mortis-btn" style="display: none;">Download</button>

    <div class="canvas-wrapper">
        <canvas id="imageCanvas"></canvas>
    </div>
</div>

<script>
    const imageLoader = document.getElementById('imageLoader');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const thresholdSlider = document.getElementById('threshold');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentImg = null;

    imageLoader.addEventListener('change', (e) => {
        const reader = new FileReader();
        reader.onload = (event) => {
            currentImg = new Image();
            currentImg.onload = () => {
                canvas.width = currentImg.width;
                canvas.height = currentImg.height;
                processImage();
                downloadBtn.style.display = 'block';
            };
            currentImg.src = event.target.result;
        };
        if (e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    });

    processBtn.addEventListener('click', processImage);
    thresholdSlider.addEventListener('input', processImage);

    function processImage() {
        if (!currentImg) return;

        const threshold = parseInt(thresholdSlider.value);
        ctx.drawImage(currentImg, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            const avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            const binary = avg >= threshold ? 255 : 0;

            data[i] = binary;
            data[i + 1] = binary;
            data[i + 2] = binary;
        }

        ctx.putImageData(imgData, 0, 0);
    }

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'binary_mortis.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
