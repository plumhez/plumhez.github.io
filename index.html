<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пупс чат</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            padding: 20px;
            margin: 0;
            position: relative;
        }

        body.menu-open::after {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 9;
        }

        /* ГЛАВНАЯ КАРТОЧКА */
        .glass-card {
            max-width: 600px;
            width: 100%;
            background: #141414;
            border-radius: 32px;
            padding: 52px 40px 44px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }

        /* Стикер-ребенок (молокосос) */
        .sticker-baby {
            font-size: 80px;
            line-height: 1;
            margin: 0 auto 12px;
            display: block;
            filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.6));
            animation: float 3s ease-in-out infinite;
            user-select: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Маленькие стикеры вокруг */
        .sticker-ring {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .sticker-ring span {
            font-size: 28px;
            line-height: 1;
            opacity: 0.6;
            transition: opacity 0.2s;
            cursor: default;
        }

        .sticker-ring span:hover {
            opacity: 1;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -1px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 60%, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
            margin-bottom: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .user-badge span {
            color: #ccc;
        }

        .sub-tg {
            font-size: 0.8rem;
            color: #555;
            font-weight: 400;
            letter-spacing: 0.2px;
            margin-top: 2px;
            margin-bottom: 28px;
            background: rgba(255, 255, 255, 0.03);
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sub-tg a {
            color: #666;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .sub-tg a:hover {
            color: #aaa;
        }

        .btn-chats {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 48px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            margin-top: 4px;
            width: 100%;
            max-width: 280px;
            background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
        }

        .btn-chats:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .btn-chats:active {
            transform: scale(0.96);
        }

        /* БОКОВОЕ МЕНЮ */
        .side-menu {
            position: fixed;
            top: 0;
            right: -400px;
            width: 380px;
            max-width: 88vw;
            height: 100vh;
            background: #111111;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: -8px 0 48px rgba(0, 0, 0, 0.8);
            padding: 32px 24px 40px;
            z-index: 99;
            transition: right 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            overflow-y: auto;
        }

        .side-menu.open {
            right: 0;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .menu-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-header h2 span {
            font-size: 28px;
        }

        .menu-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: #555;
            padding: 0 4px;
            transition: all 0.2s;
            line-height: 1;
        }

        .menu-close:hover {
            color: #aaa;
            transform: rotate(90deg);
        }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .chat-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .chat-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .chat-item .emoji-badge {
            font-size: 1.6rem;
            line-height: 1;
            min-width: 36px;
        }

        .chat-item .chat-name {
            flex: 1;
            color: #e0e0e0;
        }

        .chat-item .chat-badge {
            background: rgba(255, 255, 255, 0.06);
            color: #666;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 14px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .chat-item.locked .chat-badge {
            color: #884444;
            background: rgba(200, 80, 80, 0.1);
        }

        .chat-item.unlocked .chat-badge {
            color: #448844;
            background: rgba(80, 200, 80, 0.08);
        }

        .menu-footer {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.75rem;
            color: #444;
            text-align: center;
        }

        .menu-footer a {
            color: #555;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .menu-footer a:hover {
            color: #888;
        }

        /* МОДАЛКА ПАРОЛЯ */
        .password-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .password-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .password-modal-content {
            background: #161616;
            padding: 40px 36px;
            border-radius: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .password-modal.active .password-modal-content {
            transform: scale(1) translateY(0);
        }

        .password-modal-content .sticker-lock {
            font-size: 48px;
            display: block;
            margin-bottom: 4px;
        }

        .password-modal-content h3 {
            font-size: 1.4rem;
            color: #ffffff;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .password-modal-content .chat-name-display {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 20px;
            display: block;
        }

        .password-modal-content input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            transition: border-color 0.2s;
            outline: none;
            margin-bottom: 10px;
        }

        .password-modal-content input::placeholder {
            color: #444;
        }

        .password-modal-content input:focus {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .password-modal-content .error-msg {
            color: #cc5555;
            font-size: 0.8rem;
            min-height: 22px;
            margin-bottom: 8px;
        }

        .password-modal-content .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .password-modal-content .modal-buttons button {
            padding: 12px 28px;
            border-radius: 16px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .password-modal-content .btn-confirm {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            flex: 1;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .password-modal-content .btn-confirm:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .password-modal-content .btn-cancel {
            background: rgba(255, 255, 255, 0.04);
            color: #666;
            flex: 0.5;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .password-modal-content .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* МОДАЛКА ПСЕВДОНИМА */
        .nickname-modal {
            position: fixed;
            inset: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .nickname-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .nickname-modal-content {
            background: #161616;
            padding: 44px 36px 38px;
            border-radius: 32px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nickname-modal.active .nickname-modal-content {
            transform: scale(1) translateY(0);
        }

        .nickname-modal-content .sticker-baby-big {
            font-size: 64px;
            display: block;
            margin-bottom: 4px;
        }

        .nickname-modal-content h3 {
            font-size: 1.6rem;
            color: #ffffff;
            margin-bottom: 2px;
            font-weight: 700;
        }

        .nickname-modal-content .sub-hint {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .nickname-modal-content .sub-hint small {
            color: #444;
            font-weight: 400;
            display: block;
            margin-top: 4px;
            font-size: 0.75rem;
        }

        .nickname-modal-content input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            transition: border-color 0.2s;
            outline: none;
            margin-bottom: 16px;
            text-align: center;
        }

        .nickname-modal-content input::placeholder {
            color: #444;
        }

        .nickname-modal-content input:focus {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .nickname-modal-content .btn-set-nick {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.06);
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }

        .nickname-modal-content .btn-set-nick:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Стикеры-молокососы в футере */
        .sticker-line {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 18px;
            opacity: 0.3;
            flex-wrap: wrap;
        }

        .sticker-line span {
            transition: opacity 0.2s;
            cursor: default;
        }

        .sticker-line span:hover {
            opacity: 0.7;
        }

        @media (max-width: 500px) {
            .glass-card {
                padding: 36px 20px 32px;
            }
            h1 {
                font-size: 2.2rem;
            }
            .btn-chats {
                padding: 14px 24px;
                font-size: 1rem;
                max-width: 100%;
            }
            .side-menu {
                width: 100%;
                max-width: 100vw;
                right: -110%;
            }
            .side-menu.open {
                right: 0;
            }
            .sticker-baby {
                font-size: 60px;
            }
            .sticker-ring span {
                font-size: 22px;
            }
            .password-modal-content,
            .nickname-modal-content {
                padding: 30px 20px;
            }
        }

        /* Скрытый скролл */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <!-- ГЛАВНАЯ КАРТОЧКА -->
    <div class="glass-card" id="mainCard">
        <!-- Стикер-ребенок (молокосос) -->
        <span class="sticker-baby">👶</span>

        <!-- Маленькие стикеры вокруг -->
        <div class="sticker-ring">
            <span>🍼</span>
            <span>🧸</span>
            <span>🐻</span>
            <span>⭐</span>
        </div>

        <h1>Пупс чат</h1>

        <div class="user-badge">
            👤 <span id="nicknameDisplay">Гость</span>
        </div>

        <div class="sub-tg">
            📌 тг <a href="https://t.me/rcvpg" target="_blank">@rcvpg</a> — пароли для пупсов
        </div>

        <button class="btn-chats" id="openMenuBtn">💬 Чаты</button>

        <!-- Стикерная линия внизу -->
        <div class="sticker-line">
            <span>👶</span>
            <span>🍼</span>
            <span>🧸</span>
            <span>🐣</span>
            <span>🍭</span>
            <span>🧁</span>
        </div>
    </div>

    <!-- БОКОВОЕ МЕНЮ -->
    <div class="side-menu" id="sideMenu">
        <div class="menu-header">
            <h2><span>👶</span> Чаты</h2>
            <button class="menu-close" id="closeMenuBtn">✕</button>
        </div>

        <div class="chat-list" id="chatList"></div>

        <div class="menu-footer">
            <span>🔐 пароли — </span>
            <a href="https://t.me/rcvpg" target="_blank">@rcvpg</a>
            <div style="margin-top: 8px; font-size: 14px; opacity: 0.4;">
                🍼 🧸 🐻 ⭐
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПАРОЛЯ -->
    <div class="password-modal" id="passwordModal">
        <div class="password-modal-content">
            <span class="sticker-lock">🔐</span>
            <h3>Введите пароль</h3>
            <span class="chat-name-display" id="passwordChatName">Общий #2</span>
            <input type="password" id="passwordInput" placeholder="Пароль от чата" autocomplete="off" />
            <div class="error-msg" id="passwordError"></div>
            <div class="modal-buttons">
                <button class="btn-cancel" id="passwordCancel">Отмена</button>
                <button class="btn-confirm" id="passwordConfirm">Войти</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПСЕВДОНИМА -->
    <div class="nickname-modal" id="nicknameModal">
        <div class="nickname-modal-content">
            <span class="sticker-baby-big">👶</span>
            <h3>Привет, пупс!</h3>
            <div class="sub-hint">
                Введите ваш псевдоним
                <small>🍼 он сохранится навсегда</small>
            </div>
            <input type="text" id="nicknameInput" placeholder="Ваш псевдоним" maxlength="30" autocomplete="off" />
            <button class="btn-set-nick" id="setNickBtn">Сохранить</button>
        </div>
    </div>

    <script>
        // ---------- FIREBASE ----------
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyReplaceMe123456789",
            authDomain: "your-project.firebaseapp.com",
            databaseURL: "https://your-project-default-rtdb.firebaseio.com",
            projectId: "your-project",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456"
        };

        let database;
        try {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            console.log('🔥 Firebase подключена');
        } catch (e) {
            console.warn('⚠️ Firebase не инициализирована');
            database = null;
        }

        // ---------- ДАННЫЕ ЧАТОВ ----------
        const CHATS = [
            { id: 'general', name: 'Общий', emoji: '🌐', badge: 'все', password: null },
            { id: 'general2', name: 'Общий #2', emoji: '🔹', badge: '🔒', password: 'pupsland.on.top' },
            { id: 'general3', name: 'Общий #3', emoji: '🔸', badge: '🔒', password: 'spworld.soset' },
            { id: 'general4', name: 'Общий #4', emoji: '🟣', badge: '🔒', password: 'plumhez.pidor' }
        ];

        // ---------- STATE ----------
        let currentNickname = localStorage.getItem('pups_nickname') || '';
        let unlockedChats = JSON.parse(localStorage.getItem('pups_unlocked') || '[]');

        // ---------- ЭЛЕМЕНТЫ ----------
        const nicknameModal = document.getElementById('nicknameModal');
        const nicknameInput = document.getElementById('nicknameInput');
        const setNickBtn = document.getElementById('setNickBtn');
        const nicknameDisplay = document.getElementById('nicknameDisplay');

        const passwordModal = document.getElementById('passwordModal');
        const passwordInput = document.getElementById('passwordInput');
        const passwordError = document.getElementById('passwordError');
        const passwordChatName = document.getElementById('passwordChatName');
        const passwordConfirm = document.getElementById('passwordConfirm');
        const passwordCancel = document.getElementById('passwordCancel');

        const chatList = document.getElementById('chatList');
        const openMenuBtn = document.getElementById('openMenuBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const sideMenu = document.getElementById('sideMenu');

        let pendingChatId = null;

        // ---------- ПСЕВДОНИМ ----------
        function showNicknameModal() {
            nicknameModal.classList.add('active');
            nicknameInput.value = currentNickname || '';
            nicknameInput.focus();
            nicknameInput.select();
        }

        function hideNicknameModal() {
            nicknameModal.classList.remove('active');
        }

        function setNickname() {
            const val = nicknameInput.value.trim();
            if (val.length < 2) {
                alert('Псевдоним должен быть хотя бы 2 символа');
                return;
            }
            currentNickname = val;
            localStorage.setItem('pups_nickname', currentNickname);
            nicknameDisplay.textContent = currentNickname;
            hideNicknameModal();
        }

        // ---------- ПАРОЛИ ----------
        function isChatUnlocked(chatId) {
            return unlockedChats.includes(chatId);
        }

        function unlockChat(chatId) {
            if (!unlockedChats.includes(chatId)) {
                unlockedChats.push(chatId);
                localStorage.setItem('pups_unlocked', JSON.stringify(unlockedChats));
            }
        }

        function showPasswordModal(chatId, chatName) {
            pendingChatId = chatId;
            passwordChatName.textContent = chatName;
            passwordInput.value = '';
            passwordError.textContent = '';
            passwordModal.classList.add('active');
            setTimeout(() => passwordInput.focus(), 100);
        }

        function hidePasswordModal() {
            passwordModal.classList.remove('active');
            pendingChatId = null;
        }

        function tryPassword() {
            const entered = passwordInput.value.trim();
            const chat = CHATS.find(c => c.id === pendingChatId);
            if (!chat) return;

            if (entered === chat.password) {
                unlockChat(chat.id);
                hidePasswordModal();
                renderChats();
                enterChat(chat.id);
            } else {
                passwordError.textContent = '❌ Неверный пароль';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // ---------- ВХОД В ЧАТ ----------
        function enterChat(chatId) {
            const chat = CHATS.find(c => c.id === chatId);
            if (!chat) return;

            if (chat.password && !isChatUnlocked(chat.id)) {
                showPasswordModal(chat.id, chat.name);
                return;
            }

            alert(`📨 Вход в чат «${chat.name}»\n👤 ${currentNickname || 'Гость'}`);
            closeMenu();
        }

        // ---------- ОТРИСОВКА МЕНЮ ----------
        function renderChats() {
            chatList.innerHTML = '';
            CHATS.forEach(chat => {
                const unlocked = isChatUnlocked(chat.id) || !chat.password;
                const div = document.createElement('div');
                div.className = `chat-item ${unlocked ? 'unlocked' : 'locked'}`;
                div.innerHTML = `
                    <span class="emoji-badge">${chat.emoji}</span>
                    <span class="chat-name">${chat.name}</span>
                    <span class="chat-badge">${unlocked ? '✅' : '🔒'}</span>
                `;
                div.addEventListener('click', () => {
                    if (!currentNickname) {
                        alert('Сначала укажите псевдоним!');
                        showNicknameModal();
                        return;
                    }
                    enterChat(chat.id);
                });
                chatList.appendChild(div);
            });
        }

        // ---------- УПРАВЛЕНИЕ МЕНЮ ----------
        function openMenu() {
            sideMenu.classList.add('open');
            document.body.classList.add('menu-open');
            renderChats();
        }

        function closeMenu() {
            sideMenu.classList.remove('open');
            document.body.classList.remove('menu-open');
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        function init() {
            if (currentNickname) {
                nicknameDisplay.textContent = currentNickname;
            } else {
                showNicknameModal();
            }

            setNickBtn.addEventListener('click', setNickname);
            nicknameInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') setNickname();
            });

            passwordConfirm.addEventListener('click', tryPassword);
            passwordCancel.addEventListener('click', hidePasswordModal);
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') tryPassword();
                if (e.key === 'Escape') hidePasswordModal();
            });

            passwordModal.addEventListener('click', (e) => {
                if (e.target === passwordModal) hidePasswordModal();
            });

            openMenuBtn.addEventListener('click', openMenu);
            closeMenuBtn.addEventListener('click', closeMenu);

            document.addEventListener('click', (e) => {
                if (document.body.classList.contains('menu-open')) {
                    const card = document.getElementById('mainCard');
                    if (!sideMenu.contains(e.target) && !card.contains(e.target)) {
                        closeMenu();
                    }
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeMenu();
                    hidePasswordModal();
                }
            });

            renderChats();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
