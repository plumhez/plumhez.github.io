<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mortis</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Tahoma дает тот самый более широкий и четкий шрифт текста */
            font-family: Tahoma, Geneva, Verdana, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Точные пропорции формы */
        .wrapper {
            width: 360px;
        }

        /* Выравнивание заголовка точно по краю инпутов */
        .main-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 16px;
            margin-left: 20px;
            text-align: left;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-card {
            background: linear-gradient(to bottom, #dcdcdc 0%, #ffffff 75%, #ffffff 100%);
            border-radius: 20px;
            padding: 24px 20px 36px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 6px;
        }

        /* Широкий текст над полями */
        .input-label {
            color: #333333;
            font-size: 13px;
            margin-bottom: 3px;
            display: block;
            letter-spacing: 0.6px; /* Делает текст визуально шире */
        }

        /* Поля ввода строго нужного размера */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 22px;
            background-color: #383838;
            border: 1px solid #1a1a1a;
            border-radius: 1px;
            color: #ffffff;
            padding: 0 6px;
            font-size: 12px;
            outline: none;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.7);
        }

        /* Кнопка */
        .login-button {
            background: linear-gradient(to bottom, #595959 0%, #313131 50%, #1c1c1c 51%, #111111 100%);
            border: 1px solid #0a0a0a;
            color: #b5b5b5;
            padding: 4px 20px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
            text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.8);
            transition: opacity 0.15s ease;
            font-family: Arial, Helvetica, sans-serif;
        }

        .login-button:hover {
            opacity: 0.9;
            color: #ffffff;
        }

        .login-button:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h1 class="main-title">Login</h1>

        <div class="login-card">
            <form action="#" method="POST" onsubmit="event.preventDefault();">
                <div class="input-group">
                    <label for="username" class="input-label">Username</label>
                    <input type="text" id="username" name="username" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="password" class="input-label">Password</label>
                    <input type="password" id="password" name="password">
                </div>

                <button type="submit" class="login-button">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
