<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANDELA_ARCHIVE // SIGNAL_PROCESSOR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'VT323', monospace;
            user-select: none;
        }

        body {
            background-color: #030303;
            color: #c0c0c0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* CRT сканлайны и виньетка по краям */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle, rgba(0,0,0,0) 55%, rgba(0,0,0,0.9) 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.6) 50%);
            background-size: 100% 100%, 100% 3px;
            pointer-events: none;
            z-index: 10;
        }

        .container {
            width: 100%;
            max-width: 760px;
            padding: 20px;
            background: #080808;
            border: 1px solid #1a1a1a;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.95);
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }

        .status-indicator {
            color: #ff3333;
            font-size: 16px;
            text-align: left;
            animation: blink 1s infinite;
        }

        h1 {
            color: #e0e0e0;
            font-size: 26px;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #444;
            font-size: 13px;
            margin-top: 2px;
        }

        /* Визуальный контейнер */
        .viewport {
            width: 100%;
            height: 420px;
            background: #000;
            border: 1px solid #222;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            overflow: hidden;
        }

        #canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            /* Легкое горизонтальное размытие кассетного аналога */
            filter: blur(0.3px) contrast(1.15);
        }

        .upload-placeholder {
            text-align: center;
            color: #555;
        }

        .tape-icon {
            font-size: 48px;
            margin-bottom: 10px;
            filter: grayscale(1);
        }

        .warning {
            display: block;
            font-size: 12px;
            color: #772222;
            margin-top: 5px;
        }

        #file-input {
            display: none;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            background: #111;
            border: 1px solid #333;
            color: #888;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #222;
            color: #fff;
        }

        .btn.active {
            background: #8c8c8c;
            color: #000;
            border-color: #fff;
            font-weight: bold;
        }

        /* Кнопка помех */
        #btn-glitch.active-glitch {
            background: #8b0000;
            color: #fff;
            border-color: #ff3333;
        }

        footer {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 14px;
            color: #444;
            border-top: 1px dashed #222;
            padding-top: 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>

    <div class="container">
        <header>
            <div class="status-indicator">● REC</div>
            <h1>MANDELA_ARCHIVE_v0.2</h1>
            <p class="subtitle">FACIAL IDENTIFICATION & SIGNAL DECRYPTION</p>
        </header>

        <main>
            <div class="viewport" id="drop-zone">
                <canvas id="canvas"></canvas>
                <div class="upload-placeholder" id="placeholder">
                    <div class="tape-icon">📼</div>
                    <p>[ НАЖМИТЕ ИЛИ ПЕРЕТАЩИТЕ ИЗОБРАЖЕНИЕ ]</p>
                    <span class="warning">WARNING: DO NOT PROCESS UNKNOWN ALTERNATES</span>
                </div>
                <input type="file" id="file-input" accept="image/*">
            </div>

            <div class="controls">
                <button class="btn active" data-filter="mandela">MANDELA_CATALOGUE</button>
                <button class="btn" data-filter="intruder">ALTERNATE_FACIAL</button>
                <button class="btn" id="btn-glitch">ADD_NOISE [ПОМЕХИ]</button>
            </div>
        </main>

        <footer>
            <span>TAPE_ID: #4092-B</span>
            <span id="timestamp">1992-08-12 02:41:00</span>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const placeholder = document.getElementById('placeholder');
        const buttons = document.querySelectorAll('.controls .btn:not(#btn-glitch)');
        const glitchBtn = document.getElementById('btn-glitch');

        let currentImage = null;
        let activeFilter = 'mandela';
        let glitchEnabled = false;

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', handleFile);

        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile();
            }
        });

        function handleFile() {
            const file = fileInput.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    placeholder.style.display = 'none';
                    render();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        buttons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.dataset.filter;
                render();
            });
        });

        glitchBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            glitchEnabled = !glitchEnabled;
            glitchBtn.classList.toggle('active-glitch', glitchEnabled);
            render();
        });

        function render() {
            if (!currentImage) return;

            // Сжимаем разрешение кадра для эффекта старого кассетного качества
            const targetWidth = 480;
            const scale = targetWidth / currentImage.width;
            canvas.width = targetWidth;
            canvas.height = currentImage.height * scale;

            ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
            
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;

            // 1. Фильтр Mandela Catalogue (глубокий монохром + контраст теней + зерно)
            if (activeFilter === 'mandela') {
                for (let i = 0; i < data.length; i += 4) {
                    let gray = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
                    
                    // Выкручиваем тени (глаза и рот уходят в черную пустоту)
                    if (gray < 85) {
                        gray = gray * 0.45;
                    } else if (gray > 160) {
                        gray = Math.min(255, gray * 1.25);
                    }

                    // Сильная аналоговая зернистость
                    let grain = (Math.random() - 0.5) * 65;
                    gray = Math.min(255, Math.max(0, gray + grain));

                    data[i] = gray;
                    data[i+1] = gray;
                    data[i+2] = gray;
                }
            } 
            // 2. Фильтр Alternate Facial (агрессивное проявление черных силуэтов)
            else if (activeFilter === 'intruder') {
                for (let i = 0; i < data.length; i += 4) {
                    let gray = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
                    
                    gray = gray < 105 ? gray * 0.2 : gray * 1.35;

                    let grain = (Math.random() - 0.5) * 50;
                    gray = Math.min(255, Math.max(0, gray + grain));

                    data[i] = gray;
                    data[i+1] = gray * 0.96;
                    data[i+2] = gray * 0.92;
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // 3. Генерация полос помех при включении соответствующей кнопки
            if (glitchEnabled) {
                applyVHSGlitch();
            }
        }

        function applyVHSGlitch() {
            let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imgData.data;
            const width = canvas.width;
            const height = canvas.height;

            // Сдвиг полос по горизонтали (Tracking Shift)
            const numCorruptLines = Math.floor(Math.random() * 8) + 4;
            for (let i = 0; i < numCorruptLines; i++) {
                let startY = Math.floor(Math.random() * height);
                let lineHeight = Math.floor(Math.random() * 6) + 1;
                let offsetX = (Math.random() - 0.5) * 45;

                for (let y = startY; y < Math.min(height, startY + lineHeight); y++) {
                    for (let x = 0; x < width; x++) {
                        let sourceX = Math.floor(x + offsetX);
                        if (sourceX >= 0 && sourceX < width) {
                            let destIdx = (y * width + x) * 4;
                            let srcIdx = (y * width + sourceX) * 4;

                            data[destIdx] = data[srcIdx];
                            data[destIdx + 1] = data[srcIdx + 1];
                            data[destIdx + 2] = data[srcIdx + 2];
                        }
                    }
                }
            }

            // Белые кассетные артефакты и битый шум
            for (let i = 0; i < data.length; i += 4) {
                if (Math.random() < 0.07) {
                    let noiseVal = Math.random() > 0.5 ? 255 : 0;
                    data[i] = noiseVal;
                    data[i+1] = noiseVal;
                    data[i+2] = noiseVal;
                }
            }

            ctx.putImageData(imgData, 0, 0);
        }

        setInterval(() => {
            const now = new Date();
            document.getElementById('timestamp').innerText = 
                now.toISOString().replace('T', ' ').substring(0, 19);
        }, 1000);
    </script>
</body>
</html>
