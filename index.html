<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYSTEM_09 // SIGNAL_PROCESSOR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body>

    <div class="crt-overlay"></div>
    <div class="vhs-glitch-line"></div>

    <div class="container">
        <header>
            <div class="status-indicator">● REC</div>
            <h1>SIGNAL_PROCESSOR_v0.84</h1>
            <p class="subtitle">UNAUTHORIZED MEDIA DECRYPTION UTILITY</p>
        </header>

        <main>
            <div class="viewport" id="drop-zone">
                <canvas id="canvas"></canvas>
                <div class="upload-placeholder" id="placeholder">
                    <div class="tape-icon">📼</div>
                    <p>[ НАЖМИТЕ ИЛИ ПЕРЕТАЩИТЕ ФАЙЛ ]</p>
                    <span class="warning">WARN: FORMAT MUST BE RASTER MEDIA</span>
                </div>
                <input type="file" id="file-input" accept="image/*">
            </div>

            <div class="controls">
                <button class="btn active" data-filter="none">RAW_SIGNAL</button>
                <button class="btn" data-filter="vhs">VHS_TAPE</button>
                <button class="btn" data-filter="cctv">CCTV_1989</button>
                <button class="btn" data-filter="threshold">1-BIT_THRESHOLD</button>
                <button class="btn" data-filter="thermal">INFRARED_SPEC</button>
            </div>
        </main>

        <footer>
            <span>SYS_MEM: 64KB OK</span>
            <span id="timestamp">1997-11-04 03:14:07</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
