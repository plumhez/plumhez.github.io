<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORTIS // BINARY PROCESSOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>[ BINARY CONVERTER ]</h1>
    
    <div class="controls">
        <label for="imageLoader" class="custom-file-upload">
            SELECT IMAGE
        </label>
        <input type="file" id="imageLoader" accept="image/*">

        <div class="slider-group">
            <label for="threshold">THRESHOLD LEVEL: <span id="thresholdValue">128</span></label>
            <input type="range" id="threshold" min="0" max="255" value="128">
        </div>

        <button id="downloadBtn" style="display: none;">DOWNLOAD RESULT</button>
    </div>

    <canvas id="imageCanvas"></canvas>
</div>

<script>
    const imageLoader = document.getElementById('imageLoader');
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    const thresholdSlider = document.getElementById('threshold');
    const thresholdValue = document.getElementById('thresholdValue');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentImg = null;

    imageLoader.addEventListener('change', handleImage, false);
    thresholdSlider.addEventListener('input', processImage);
    downloadBtn.addEventListener('click', downloadImage);

    function handleImage(e) {
        const reader = new FileReader();
        reader.onload = function(event) {
            currentImg = new Image();
            currentImg.onload = function() {
                canvas.width = currentImg.width;
                canvas.height = currentImg.height;
                processImage();
                downloadBtn.style.display = 'inline-block';
            }
            currentImg.src = event.target.result;
        }
        if (e.target.files[0]) {
            reader.readAsDataURL(e.target.files[0]);
        }
    }

    function processImage() {
        if (!currentImg) return;

        const threshold = parseInt(thresholdSlider.value);
        thresholdValue.innerText = threshold;

        ctx.drawImage(currentImg, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        for (let i = 0; i < data.length; i += 4) {
            const avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
            const binary = avg >= threshold ? 255 : 0;

            data[i]     = binary;
            data[i + 1] = binary;
            data[i + 2] = binary;
        }

        ctx.putImageData(imgData, 0, 0);
    }

    function downloadImage() {
        const link = document.createElement('a');
        link.download = 'binary_mortis.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }
</script>

</body>
</html>
