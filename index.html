<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PupsLand Chat</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

html,body{

width:100%;
height:100%;

overflow:hidden;

background:#f5f5f7;

}

body{

display:flex;

justify-content:center;

align-items:center;

color:#1d1d1f;

}

body::before{

content:"";

position:fixed;

inset:0;

background:

radial-gradient(circle at 20% 20%,rgba(0,122,255,.08),transparent 35%),

radial-gradient(circle at 80% 10%,rgba(255,255,255,.9),transparent 40%),

linear-gradient(#fafafa,#f3f3f5);

z-index:-1;

animation:bg 14s ease infinite;

}

@keyframes bg{

0%{transform:scale(1)}

50%{transform:scale(1.04)}

100%{transform:scale(1)}

}

.login{

position:fixed;

inset:0;

display:flex;

align-items:center;

justify-content:center;

transition:.6s;

}

.card{

width:430px;

background:rgba(255,255,255,.82);

backdrop-filter:blur(28px);

border-radius:30px;

padding:45px;

box-shadow:

0 25px 80px rgba(0,0,0,.08);

animation:card .8s;

}

@keyframes card{

from{

opacity:0;

transform:

translateY(35px)

scale(.95);

}

to{

opacity:1;

transform:

translateY(0)

scale(1);

}

}

.logo{

font-size:60px;

text-align:center;

margin-bottom:18px;

}

h1{

text-align:center;

font-size:34px;

margin-bottom:10px;

}

.subtitle{

text-align:center;

color:#777;

margin-bottom:35px;

font-size:15px;

}

input{

width:100%;

height:58px;

border:none;

outline:none;

background:#f2f2f2;

border-radius:18px;

padding:0 18px;

font-size:16px;

transition:.25s;

}

input:focus{

background:white;

box-shadow:

0 0 0 4px rgba(0,122,255,.15);

}

button{

width:100%;

height:58px;

margin-top:18px;

border:none;

border-radius:18px;

background:#0071e3;

color:white;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:.25s;

}

button:hover{

transform:translateY(-2px);

box-shadow:

0 15px 30px rgba(0,113,227,.25);

}
  .chat{

position:fixed;

inset:0;

display:none;

flex-direction:column;

opacity:0;

transition:.5s;

background:#f5f5f7;

}

.chat.show{

display:flex;

opacity:1;

}

header{

height:78px;

background:rgba(255,255,255,.8);

backdrop-filter:blur(30px);

border-bottom:1px solid rgba(0,0,0,.06);

display:flex;

justify-content:space-between;

align-items:center;

padding:0 28px;

}

.brand{

display:flex;

align-items:center;

gap:15px;

}

.icon{

width:46px;

height:46px;

border-radius:14px;

background:white;

display:flex;

justify-content:center;

align-items:center;

font-size:22px;

box-shadow:

0 8px 20px rgba(0,0,0,.08);

}

.brand h2{

font-size:21px;

font-weight:700;

}

.brand p{

font-size:13px;

color:#777;

margin-top:2px;

}

.online{

font-size:14px;

font-weight:600;

color:#30d158;

}

.messages{

flex:1;

overflow-y:auto;

padding:24px;

display:flex;

flex-direction:column;

gap:15px;

}

.message{

max-width:420px;

padding:15px 18px;

background:white;

border-radius:22px;

box-shadow:

0 8px 18px rgba(0,0,0,.05);

animation:msg .25s;

word-break:break-word;

}

.message.self{

margin-left:auto;

background:#007aff;

color:white;

}

.author{

font-size:13px;

font-weight:700;

opacity:.7;

margin-bottom:5px;

}

.time{

font-size:11px;

opacity:.55;

margin-top:8px;

}

@keyframes msg{

from{

opacity:0;

transform:

translateY(20px)

scale(.95);

}

to{

opacity:1;

transform:

translateY(0)

scale(1);

}

}

.bottom{

height:90px;

display:flex;

gap:15px;

padding:18px;

background:white;

border-top:1px solid rgba(0,0,0,.05);

}

.bottom input{

flex:1;

height:54px;

border:none;

outline:none;

background:#f2f2f2;

border-radius:18px;

padding:0 18px;

font-size:16px;

}

.send{

width:58px;

height:54px;

border:none;

border-radius:18px;

background:#007aff;

color:white;

font-size:22px;

cursor:pointer;

transition:.2s;

}

.send:hover{

transform:scale(1.05);

}

::-webkit-scrollbar{

width:8px;

}

::-webkit-scrollbar-thumb{

background:#d0d0d0;

border-radius:999px;

}

@media(max-width:700px){

.card{

width:92%;

padding:32px;

}

header{

padding:0 18px;

}

.messages{

padding:16px;

}

.message{

max-width:92%;

}

}

</style>

</head>

<body>

<div class="login" id="login">

<div class="card">

<div class="logo">💬</div>

<h1>PupsLand</h1>

<p class="subtitle">

Введите псевдоним

</p>

<input

id="nickname"

placeholder="Например Max">

<button id="join">

Войти

</button>

</div>

</div>

<div class="chat" id="chat">

<header>

<div class="brand">

<div class="icon">

💬

</div>

<div>

<h2>PupsLand Chat</h2>

<p>

Firebase Online

</p>

</div>

</div>

<div class="online">

● Онлайн

</div>

</header>

<div

class="messages"

id="messages">
  </div>

<div class="bottom">

<input
id="message"
placeholder="Сообщение...">

<button
class="send"
id="send">

➜

</button>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {

getFirestore,

collection,

addDoc,

query,

orderBy,

onSnapshot,

serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={

apiKey:"AIzaSyDLbYzjQBqtjRAlR6-CZj2TZXJgb2Esz4M",

authDomain:"plumhez.firebaseapp.com",

projectId:"plumhez",

storageBucket:"plumhez.firebasestorage.app",

messagingSenderId:"454691669371",

appId:"1:454691669371:web:4135144fa0270b5085e9de",

measurementId:"G-N2TBHG8V9K"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const login=document.getElementById("login");

const chat=document.getElementById("chat");

const join=document.getElementById("join");

const nickname=document.getElementById("nickname");

const messages=document.getElementById("messages");

const message=document.getElementById("message");

const send=document.getElementById("send");

let user=localStorage.getItem("nickname")||"";

function openChat(){

login.style.opacity="0";

login.style.transform="scale(.95)";

setTimeout(()=>{

login.style.display="none";

chat.style.display="flex";

requestAnimationFrame(()=>{

chat.classList.add("show");

});

},500);

}

if(user){

nickname.value=user;

openChat();

}
  join.onclick=()=>{

const nick=nickname.value.trim();

if(nick.length<2){

alert("Введите псевдоним");

return;

}

user=nick;

localStorage.setItem("nickname",user);

openChat();

};

function time(date){

if(!date) return "";

const d=date.toDate();

return d.getHours().toString().padStart(2,"0")

+":"

+d.getMinutes().toString().padStart(2,"0");

}

function createMessage(data,id){

const div=document.createElement("div");

div.className=

data.author===user

?

"message self"

:

"message";

div.dataset.id=id;

div.innerHTML=`

<div class="author">

${data.author}

</div>

<div>

${escapeHtml(data.text)}

</div>

<div class="time">

${time(data.created)}

</div>

`;

messages.appendChild(div);

messages.scrollTop=messages.scrollHeight;

}

function escapeHtml(text){

return text

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}

async function sendMessage(){

const text=message.value.trim();

if(text==="") return;

await addDoc(

collection(db,"messages"),

{

author:user,

text:text,

created:serverTimestamp()

}

);

message.value="";

message.focus();

}

send.onclick=sendMessage;

message.addEventListener("keydown",e=>{

if(e.key==="Enter"){

e.preventDefault();

sendMessage();

}

});
  const q=query(

collection(db,"messages"),

orderBy("created")

);

onSnapshot(q,(snapshot)=>{

messages.innerHTML="";

snapshot.forEach(doc=>{

createMessage(

doc.data(),

doc.id

);

});

messages.scrollTop=

messages.scrollHeight;

});

setTimeout(()=>{

message.focus();

},800);

</script>

</body>

</html>
